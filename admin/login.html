<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - DigitalCraft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo-icon {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 15px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 15px;
      font-size: 28px;
    }
    .logo h1 { font-size: 24px; color: #1e293b; }
    .logo p { color: #64748b; font-size: 14px; margin-top: 5px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #374151; }
    input {
      width: 100%; padding: 12px 16px;
      border: 2px solid #e5e7eb; border-radius: 10px;
      font-size: 16px;
    }
    input:focus { outline: none; border-color: #667eea; }
    button {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .error {
      background: #fee2e2; color: #dc2626;
      padding: 12px; border-radius: 8px;
      margin-bottom: 20px; display: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <h1>DigitalCraft</h1>
      <p>Admin Dashboard</p>
    </div>
    <div class="error" id="error"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      <button type="submit">Sign In</button>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      if (password === 'Gdolfwck22$$') {
        localStorage.setItem('adminPass', password);
        window.location.href = '/admin/dashboard';
      } else {
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = 'Wrong password';
      }
    });
  </script>
</body>
</html>
